services:
  php:
    container_name: bbphp-criteria-doctrine-adapter-php
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]

volumes:
  composer-cache: